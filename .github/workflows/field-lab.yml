name: Field Lab browser build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install WebAssembly compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y emscripten
      - name: Compile actual engine and browser demo
        run: bash tools/build_field_lab.sh
      - name: Test compiled simulation
        run: node tests/field_lab.cjs
      - name: Upload playable demo
        uses: actions/upload-artifact@v4
        with:
          name: field-lab
          path: build/field-lab/
          if-no-files-found: error

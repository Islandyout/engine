name: Editor browser build
on:
  pull_request:
    branches: [main, codex/native-playground]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v5
      - name: Detect whether shared engine/editor code changed
        id: changes
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - 'apps/**'
              - 'engine/**'
              - 'src/**'
              - 'include/**'
              - 'runtime/**'
              - 'examples/**'
              - 'tests/**'
              - 'tools/**'
              - '.github/workflows/**'
              - 'CMakeLists.txt'
              - '**/CMakeLists.txt'
              - 'package.json'
              - '**/package.json'
              - 'package-lock.json'
              - '**/package-lock.json'
              - 'pnpm-lock.yaml'
              - 'yarn.lock'
              - 'vite.config.*'
              - 'tsconfig*.json'
            games:
              - 'games/**'
      - name: Install WebAssembly compiler
        run: |
          git clone --depth 1 --branch 3.1.64 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.64
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.64
      - name: Build and test BTAI editor with C++ runtime
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash tools/build_editor.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser test tools
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.core == 'true'
        # A hung download fails fast here instead of using up the job's time.
        timeout-minutes: 15
        run: |
          npm install --prefix tests/browser --no-package-lock --ignore-scripts
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Test desktop and mobile browser controls
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.core == 'true'
        run: |
          node tests/browser/editor.cjs
          EDITOR_NO_WEBGL=1 node tests/browser/editor.cjs
          node tests/browser/fps.cjs
          node tests/browser/last_signal.cjs
          node tests/browser/high_heat.cjs
          node tests/browser/pale_signal.cjs
          node tests/browser/gatebreaker.cjs
          node tests/browser/gatebreaker_gate.cjs
          node tests/browser/gatebreaker_loop.cjs
      - name: Validate generated game library
        if: steps.changes.outputs.core != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const root = 'build/site';
          const indexPath = path.join(root, 'games.json');
          if (!existsSync(indexPath)) throw new Error('Build did not generate games.json');
          const index = JSON.parse(readFileSync(indexPath, 'utf8'));
          if (!Array.isArray(index.games)) throw new Error('games.json must contain a games array');
          for (const game of index.games) {
            for (const key of ['page', 'scene']) {
              const file = path.join(root, game[key]);
              if (!existsSync(file)) throw new Error(`${game.name}: missing ${key} file ${game[key]}`);
            }
          }
          console.log(`Validated ${index.games.length} game entries and their page/scene files.`);
          NODE
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: editor-browser-evidence
          path: build/browser-evidence/
          if-no-files-found: warn
      - name: Upload built site
        uses: actions/upload-artifact@v5
        with:
          name: editor-site
          path: build/site/
          if-no-files-found: error
      - name: Package verified site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site/
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: editor-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy editor site
        id: deployment
        uses: actions/deploy-pages@v4

name: Game Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/f4-action-input-bindings, codex/native-playground]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux Clang (SDL ${{ matrix.sdl }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdl: ['ON', 'OFF']
    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config
      - name: Install SDL desktop development dependencies
        if: matrix.sdl == 'ON'
        run: |
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libudev-dev libgl1-mesa-dev libegl1-mesa-dev \
            libdrm-dev libgbm-dev
      - name: Configure
        run: >-
          cmake --preset linux-clang -B build/ci-${{ matrix.sdl }}
          -DENGINE_ENABLE_SDL3=${{ matrix.sdl }}
          -DENGINE_BUILD_TESTS=ON -DENGINE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/ci-${{ matrix.sdl }} --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-${{ matrix.sdl }} --output-on-failure --no-tests=error
      - name: SDL dummy-driver smoke
        if: matrix.sdl == 'ON'
        env:
          SDL_VIDEODRIVER: dummy
        run: ./build/ci-ON/engine_host --smoke
      - name: Verify asset cooker
        run: python3 tests/cooker_tests.py
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Capture native frame
        run: ./build/ci-${{ matrix.sdl }}/engine_playground --snapshot build/native-frame.ppm
      - uses: actions/upload-artifact@v4
        with:
          name: native-playground-linux-sdl-${{ matrix.sdl }}
          path: |
            build/ci-${{ matrix.sdl }}/engine_playground
            build/ci-${{ matrix.sdl }}/assets/bench.gea
            assets/CREDITS.md
            build/native-frame.ppm
            docs/NATIVE_PLAYGROUND.md
            docs/ASSET_PIPELINE.md
            docs/images/native-bench.png
            third_party/aether/LICENSE

  windows:
    name: Windows native playground
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/native -G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DENGINE_ENABLE_SDL3=ON
      - name: Build
        run: cmake --build build/native --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure --no-tests=error
      - name: Capture native frame
        run: ./build/native/Release/engine_playground.exe --snapshot build/native-frame.ppm
      - uses: actions/upload-artifact@v4
        with:
          name: native-playground-windows
          path: |
            build/native/Release/engine_playground.exe
            build/native/Release/assets/bench.gea
            assets/CREDITS.md
            build/native-frame.ppm
            docs/NATIVE_PLAYGROUND.md
            docs/ASSET_PIPELINE.md
            docs/images/native-bench.png
            third_party/aether/LICENSE
